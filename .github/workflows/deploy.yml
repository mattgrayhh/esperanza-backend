name: Deploy (Cloudflare)

# Production deploys happen ONLY from `master`. Day-to-day work happens on feature
# branches; merging a PR into `master` is what ships. Pushing to any other branch does
# NOT deploy. Use the "Run workflow" button (workflow_dispatch) to force a redeploy.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "Deploy ALL workers regardless of what changed"
        type: boolean
        default: false

# Never run two deploys at once; let an in-flight deploy finish rather than cancel it.
concurrency:
  group: cf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `actions: read` lets "Determine changed workers" ask whether the PREVIOUS deploy
    # succeeded. See the fail-closed note in that step.
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit to diff changed packages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Decide which workers to deploy. A change to shared code (packages/db, the root
      # lockfile/manifest, or tsconfig) redeploys everything; otherwise only the workers
      # whose own package changed. First push / missing base SHA → deploy everything.
      - name: Determine changed workers
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ALL="admin api ingest pdf ops"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy_all }}" = "true" ]; then
            echo "pkgs=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # ── FAIL CLOSED AFTER A FAILED DEPLOY ─────────────────────────────
          # 2026-07-29: PR #188 merged as cf04295 and correctly targeted all five
          # workers, but the Deploy loop dies on the first failure and `admin` is
          # first — so api/ingest/pdf/ops never shipped. The NEXT push (#191, the fix
          # for that very failure) then diffed against `github.event.before`, which is
          # the previous branch head REGARDLESS of whether its deploy succeeded. Only
          # packages/admin had changed since cf04295, so the run deployed `admin`
          # alone and went green. Result: esperanza-ingest sat three days stale on
          # pre-gate code while master looked correct and CI looked green.
          #
          # A skipped worker is invisible: nothing re-deploys it until someone happens
          # to touch its package. So if the previous deploy did not fully succeed, we
          # cannot trust an incremental diff — redeploy everything. Deploying too much
          # is a no-op; deploying too little is silent production drift.
          PREV="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=${GITHUB_REF_NAME}&status=completed&per_page=1&exclude_pull_requests=true" \
            --jq '.workflow_runs[0].conclusion // ""' 2>/dev/null || echo "")"
          if [ -n "$PREV" ] && [ "$PREV" != "success" ]; then
            echo "Previous deploy on ${GITHUB_REF_NAME} concluded '$PREV' — workers it skipped may never have shipped. Deploying everything."
            echo "pkgs=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$PREV" ]; then
            echo "Could not read the previous deploy's conclusion — deploying everything rather than risk an incremental diff off a failed run."
            echo "pkgs=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "pkgs=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
          if echo "$CHANGED" | grep -qE '^(packages/db/|package-lock\.json|package\.json|tsconfig)'; then
            echo "pkgs=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi

          OUT=""
          for p in $ALL; do
            if echo "$CHANGED" | grep -q "^packages/$p/"; then OUT="$OUT $p"; fi
          done
          echo "pkgs=$(echo $OUT | xargs)" >> "$GITHUB_OUTPUT"

      # ── SCHEMA BEFORE CODE ──────────────────────────────────────────────────
      # 2026-07-19: commit 62389f99 added 0029_sync_lock.sql AND the code that
      # requires the table. CI shipped the code; nobody remembered `npm run
      # db:migrate:remote`. Every ingest cron for the next six days died on
      # `no such table: sync_lock`, and because the failure happened before the run
      # could write to sync_log, no dashboard ever went red.
      #
      # Applying here removes the human step. `migrations apply` is idempotent —
      # already-applied files are skipped — so this is a no-op on most pushes, and a
      # failure here fails the build BEFORE any Worker ships ahead of its schema.
      - name: Check migration filenames
        run: node scripts/check-migrations.mjs

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply esperanza --remote --config packages/db/wrangler.toml

      - name: Deploy
        if: steps.changes.outputs.pkgs != ''
        run: |
          set -euo pipefail
          echo "Deploying: ${{ steps.changes.outputs.pkgs }}"
          for p in ${{ steps.changes.outputs.pkgs }}; do
            echo "::group::Deploy $p"
            if [ "$p" = "admin" ]; then
              # OpenNext (Next.js) build + deploy
              ( cd packages/admin && npm run deploy )
            else
              # Plain Worker
              ( cd "packages/$p" && npx wrangler deploy )
            fi
            echo "::endgroup::"
          done

      - name: Nothing changed
        if: steps.changes.outputs.pkgs == ''
        run: echo "No worker packages changed in this push — nothing to deploy."
