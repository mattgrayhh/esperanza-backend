name: Deploy (Cloudflare)

# Production deploys happen ONLY from `master`. Day-to-day work happens on feature
# branches; merging a PR into `master` is what ships. Pushing to any other branch does
# NOT deploy. Use the "Run workflow" button (workflow_dispatch) to force a redeploy.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "Deploy ALL workers regardless of what changed"
        type: boolean
        default: false

# Never run two deploys at once; let an in-flight deploy finish rather than cancel it.
concurrency:
  group: cf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit to diff changed packages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Decide which workers to deploy. A change to shared code (packages/db, the root
      # lockfile/manifest, or tsconfig) redeploys everything; otherwise only the workers
      # whose own package changed. First push / missing base SHA → deploy everything.
      - name: Determine changed workers
        id: changes
        run: |
          set -euo pipefail
          ALL="admin api ingest framer-push renderings pdf"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy_all }}" = "true" ]; then
            echo "pkgs=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "pkgs=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
          if echo "$CHANGED" | grep -qE '^(packages/db/|package-lock\.json|package\.json|tsconfig)'; then
            echo "pkgs=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi

          OUT=""
          for p in $ALL; do
            if echo "$CHANGED" | grep -q "^packages/$p/"; then OUT="$OUT $p"; fi
          done
          echo "pkgs=$(echo $OUT | xargs)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.changes.outputs.pkgs != ''
        run: |
          set -euo pipefail
          echo "Deploying: ${{ steps.changes.outputs.pkgs }}"
          for p in ${{ steps.changes.outputs.pkgs }}; do
            echo "::group::Deploy $p"
            if [ "$p" = "admin" ]; then
              # OpenNext (Next.js) build + deploy
              ( cd packages/admin && npm run deploy )
            else
              # Plain Worker
              ( cd "packages/$p" && npx wrangler deploy )
            fi
            echo "::endgroup::"
          done

      - name: Nothing changed
        if: steps.changes.outputs.pkgs == ''
        run: echo "No worker packages changed in this push — nothing to deploy."
