name = "esperanza-pdf"
main = "src/index.ts"
compatibility_date = "2025-05-20"
compatibility_flags = ["nodejs_compat"]

browser = { binding = "BROWSER" }

[[durable_objects.bindings]]
name = "RENDERER"
class_name = "BrowserRenderer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BrowserRenderer"]

[[d1_databases]]
binding = "DB"
database_name = "esperanza"
database_id = "023ea995-0abc-4165-a1e1-6e2373fc43e9"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "esperanza-cms"

[vars]
IMAGES_PUBLIC_BASE_URL = "https://img.hazardhouse.ai"
# PDF links resolve through the WORKER route (/pdf/<type>/<slug>), not the raw R2 bucket
# (R2 objects live at pdf/<type>/<id>.pdf). At cutover, repoint to media./pdf.esperanzahomes.com.
PDF_PUBLIC_BASE_URL = "https://esperanza-pdf.round-base-ed8c.workers.dev"
ADMIN_ORIGIN = "https://esperanza-admin.round-base-ed8c.workers.dev"

[[queues.producers]]
binding = "RENDER_Q"
queue = "esperanza-pdf-render"

[[queues.consumers]]
queue = "esperanza-pdf-render"
max_batch_size = 3
max_retries = 3
dead_letter_queue = "esperanza-pdf-render-dlq"
# Cap simultaneous render invocations to 1: with launch-per-render, Browser Rendering's
# new-instance RATE limit is the bottleneck (concurrency 2 fails ~26%). One render at a
# time (~8/min) stays under it; retries + DLQ catch stragglers. Raise this only after
# switching to a reused/keep-alive browser (Durable Object) — see DEPLOY.md.
max_concurrency = 1

# Nightly list warm/rebuild. GATED: the account is at its 5-cron-trigger cap until the
# legacy crons are disabled at cutover. Uncomment + deploy ONLY after a slot is freed.
# [triggers]
# crons = ["0 7 * * *"]

# Workers Logs — capture 100% of invocations (head_sampling_rate=1) so every
# request/error/console.log is queryable in the dashboard + `wrangler tail`. This is
# what makes intermittent D1 blips (and their Next.js error digests) diagnosable.
[observability]
enabled = true
head_sampling_rate = 1
